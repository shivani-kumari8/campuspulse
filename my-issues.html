<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Issues - CampusPulse</title>

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        /* NAVBAR */
        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-links a.active {
            color: var(--primary);
            font-weight: bold;
        }

        .profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: bold;
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .report-btn {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        /* FILTERS */
        .filters {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filters select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text-main);
            font-size: 14px;
        }

        /* ISSUES */
        .issues {
            display: grid;
            gap: 16px;
        }

        .issue-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
        }

        .issue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .issue-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .issue-title {
            font-size: 18px;
            font-weight: bold;
        }

        .issue-location {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* STATUS */
        .reported {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #fef3c7;
            color: #92400e;
        }

        .progress-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .resolved {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #dcfce7;
            color: #166534;
        }

        /* SEVERITY */
        .severity {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 6px;
        }

        .severity.low {
            background: #dcfce7;
            color: #166534;
        }

        .severity.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .severity.high {
            background: #fee2e2;
            color: #991b1b;
        }

        .issue-description {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .issue-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .affected {
            color: var(--text-muted);
            font-size: 13px;
        }

        .view-btn {
            text-decoration: none;
            color: var(--primary);
            font-size: 13px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        @media (max-width: 700px) {
            .nav-links {
                gap: 12px;
            }

            .filters {
                flex-direction: column;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">CampusPulse</div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="report-issue.html">Report Issue</a>
            <a href="my-issues.html" class="active">My Issues</a>
            <a href="all-issues.html">All Issues</a>
        </div>

        <div class="profile">SK</div>
    </nav>


    <div class="container">

        <!-- HEADER -->
        <div class="page-header">
            <h1>My Issues</h1>

            <a href="report-issue.html" class="report-btn">
                + Report Issue
            </a>
        </div>


        <!-- FILTERS -->
        <div class="filters">

            <select id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="reported">Waiting</option>
                <option value="progress">Under Process</option>
                <option value="resolved">Resolved</option>
            </select>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="hostel">Hostel</option>
                <option value="washroom">Washroom</option>
                <option value="wifi">Wi-Fi</option>
                <option value="mess">Mess</option>
                <option value="electricity">Electricity</option>
                <option value="classroom">Classroom</option>
                <option value="water">Water</option>
                <option value="infrastructure">Infrastructure</option>
            </select>

            <select id="severityFilter">
                <option value="all">All Severities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

        </div>


        <!-- MY REPORTED ISSUES -->
        <section class="issues" id="issues">

            <div class="issue-card"
                 data-status="progress"
                 data-category="wifi"
                 data-severity="medium">

                <div class="issue-top">
                    <div class="issue-title">
                        CP-104 — Wi-Fi not working in Block A
                    </div>

                    <div>
                        <span class="progress-status">Under Process</span>
                        <span class="severity medium">Medium</span>
                    </div>
                </div>

                <div class="issue-location">
                    Academic Block A
                </div>

                <div class="issue-description">
                    Wi-Fi unstable, affects online resources
                </div>

                <div class="issue-bottom">
                    <span class="affected">
                        42 students affected
                    </span>

                    <a href="#" class="view-btn">
                        View Issue
                    </a>
                </div>

            </div>

        </section>


        <!-- AFFECTED ISSUES -->
        <h2 style="font-size: 1.1rem; margin: 25px 0 14px;">
            Issues I'm Affected By
        </h2>

        <section class="issues" id="affectedIssues"></section>

        <div class="empty" id="emptyState" style="display:none;">
            No issues found
        </div>

    </div>


    <script>

        const statusFilter = document.getElementById("statusFilter");
        const categoryFilter = document.getElementById("categoryFilter");
        const severityFilter = document.getElementById("severityFilter");

        const reportedIssues = document.querySelectorAll("#issues .issue-card");
        const affectedIssuesContainer = document.getElementById("affectedIssues");
        const emptyState = document.getElementById("emptyState");


        /* ALL ISSUES DATA
           This matches the issues available on all-issues.html
        */
        const allIssues = [
            {
                id: "CP-104",
                title: "Broken Fan",
                location: "Engineering Block • Room 203",
                status: "process",
                category: "electricity",
                severity: "high",
                description: "Ceiling fan is not functioning properly.",
                affected: 34
            },
            {
                id: "CP-103",
                title: "Washroom Hygiene",
                location: "Admin Block • Ground Floor",
                status: "waiting",
                category: "washroom",
                severity: "high",
                description: "Washroom requires urgent cleaning and maintenance.",
                affected: 56
            },
            {
                id: "CP-102",
                title: "Water Leakage",
                location: "Science Block B • 2nd Floor",
                status: "resolved",
                category: "water",
                severity: "medium",
                description: "Water leakage was reported near the corridor.",
                affected: 21
            },
            {
                id: "CP-101",
                title: "Wi-Fi Connectivity Issue",
                location: "Library • First Floor",
                status: "waiting",
                category: "wifi",
                severity: "low",
                description: "Wi-Fi connection is unstable in the library.",
                affected: 63
            }
        ];


        /* Convert the status names used in all-issues.html
           into the names used by my-issues.html
        */
        function convertStatus(status) {

            if (status === "waiting") {
                return "reported";
            }

            if (status === "process") {
                return "progress";
            }

            if (status === "resolved") {
                return "resolved";
            }

            return status;
        }


        /* Get saved affected issue IDs */
        function getSavedVotes() {

            try {
                return JSON.parse(
                    localStorage.getItem("campus_affected_votes")
                ) || [];

            } catch (e) {

                return [];

            }
        }


        /* Show affected issues */
        function loadAffectedIssues() {

            const savedVotes = getSavedVotes();

            affectedIssuesContainer.innerHTML = "";

            savedVotes.forEach(id => {

                const issue = allIssues.find(item => item.id === id);

                if (!issue) {
                    return;
                }

                const convertedStatus = convertStatus(issue.status);

                let statusHTML = "";

                if (convertedStatus === "reported") {

                    statusHTML =
                        `<span class="reported">Waiting</span>`;

                } else if (convertedStatus === "progress") {

                    statusHTML =
                        `<span class="progress-status">Under Process</span>`;

                } else if (convertedStatus === "resolved") {

                    statusHTML =
                        `<span class="resolved">Resolved</span>`;

                }


                const card = document.createElement("div");

                card.className = "issue-card";

                card.dataset.status = convertedStatus;
                card.dataset.category = issue.category;
                card.dataset.severity = issue.severity;


                card.innerHTML = `

                    <div class="issue-top">

                        <div class="issue-title">
                            ${issue.id} — ${issue.title}
                        </div>

                        <div>
                            ${statusHTML}
                            <span class="severity ${issue.severity}">
                                ${issue.severity.charAt(0).toUpperCase() + issue.severity.slice(1)}
                            </span>
                        </div>

                    </div>

                    <div class="issue-location">
                        ${issue.location}
                    </div>

                    <div class="issue-description">
                        ${issue.description}
                    </div>

                    <div class="issue-bottom">

                        <span class="affected">
                            ${issue.affected} students affected
                        </span>

                        <a href="#" class="view-btn">
                            View Issue
                        </a>

                    </div>

                `;

                affectedIssuesContainer.appendChild(card);

            });

        }


        /* Filtering */
        function filterIssues() {

            const selectedStatus = statusFilter.value;
            const selectedCategory = categoryFilter.value;
            const selectedSeverity = severityFilter.value;

            let visibleIssues = 0;


            /* Filter reported issues */
            reportedIssues.forEach(issue => {

                const status = issue.dataset.status;
                const category = issue.dataset.category;
                const severity = issue.dataset.severity;

                const statusMatch =
                    selectedStatus === "all" ||
                    selectedStatus === status;

                const categoryMatch =
                    selectedCategory === "all" ||
                    selectedCategory === category;

                const severityMatch =
                    selectedSeverity === "all" ||
                    selectedSeverity === severity;


                if (
                    statusMatch &&
                    categoryMatch &&
                    severityMatch
                ) {

                    issue.style.display = "block";
                    visibleIssues++;

                } else {

                    issue.style.display = "none";

                }

            });


            /* Filter affected issues */
            const affectedCards =
                affectedIssuesContainer.querySelectorAll(".issue-card");


            affectedCards.forEach(issue => {

                const status = issue.dataset.status;
                const category = issue.dataset.category;
                const severity = issue.dataset.severity;

                const statusMatch =
                    selectedStatus === "all" ||
                    selectedStatus === status;

                const categoryMatch =
                    selectedCategory === "all" ||
                    selectedCategory === category;

                const severityMatch =
                    selectedSeverity === "all" ||
                    selectedSeverity === severity;


                if (
                    statusMatch &&
                    categoryMatch &&
                    severityMatch
                ) {

                    issue.style.display = "block";
                    visibleIssues++;

                } else {

                    issue.style.display = "none";

                }

            });


            /* Empty state */
            emptyState.style.display =
                visibleIssues === 0 ? "block" : "none";

        }


        statusFilter.addEventListener(
            "change",
            filterIssues
        );

        categoryFilter.addEventListener(
            "change",
            filterIssues
        );

        severityFilter.addEventListener(
            "change",
            filterIssues
        );


        /* Load affected issues when page opens */
        loadAffectedIssues();

        filterIssues();

    </script>

</body>
</html>
