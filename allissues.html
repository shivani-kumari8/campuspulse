<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Pulse | Clean & Better Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 12px 20px -5px rgba(2, 132, 199, 0.12);

      /* Status & Severity Colors */
      --status-waiting-bg: #fef3c7;
      --status-waiting-text: #92400e;
      --status-process-bg: #e0f2fe;
      --status-process-text: #0369a1;
      --status-resolved-bg: #dcfce7;
      --status-resolved-text: #15803d;

      --sev-high-bg: #fee2e2;
      --sev-high-text: #b91c1c;
      --sev-med-bg: #ffedd5;
      --sev-med-text: #c2410c;
      --sev-low-bg: #f1f5f9;
      --sev-low-text: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- INTRO OVERLAY --- */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(248, 250, 252, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content {
      text-align: center;
      animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .intro-title {
      font-size: 3.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    .intro-title span { color: var(--primary); }

    .intro-tagline {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .click-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* --- TOP NAVBAR --- */
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-brand span { color: var(--primary); }

    .nav-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn-nav {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: #e2e8f0;
    }

    .btn-nav-primary {
      background: var(--primary);
      color: #fff;
      border: none;
    }

    .btn-nav-primary:hover {
      background: var(--primary-dark);
    }

    /* --- MAIN CONTAINER --- */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 5rem 1.25rem;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Section Header */
    .section-header {
      margin-bottom: 2rem;
    }

    .section-header h2 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* --- SEARCH & FILTER CONTROLS --- */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: var(--card-bg);
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
    }

    .search-wrapper {
      position: relative;
      flex: 2;
      min-width: 220px;
    }

    .search-wrapper input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrapper input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .filter-select {
      flex: 1;
      min-width: 140px;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      background: #fafafa;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    /* --- ISSUE CARDS FEED --- */
    .issues-feed {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .issue-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .issue-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .issue-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .issue-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .issue-location {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Severity badges */
    .badge-sev-high { background: var(--sev-high-bg); color: var(--sev-high-text); }
    .badge-sev-med { background: var(--sev-med-bg); color: var(--sev-med-text); }
    .badge-sev-low { background: var(--sev-low-bg); color: var(--sev-low-text); }

    /* Status badges */
    .badge-status-waiting { background: var(--status-waiting-bg); color: var(--status-waiting-text); }
    .badge-status-process { background: var(--status-process-bg); color: var(--status-process-text); }
    .badge-status-resolved { background: var(--status-resolved-bg); color: var(--status-resolved-text); }

    .issue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .affected-counter {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
    }

    .btn-affected {
      background: #f8fafc;
      color: var(--primary-dark);
      border: 1px solid #bae6fd;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-affected:hover {
      background: var(--primary-light);
    }

    .btn-affected.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      background: #fff;
      border-radius: 12px;
      border: 1px dashed var(--border);
      color: var(--text-muted);
    }

    /* --- MODALS --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 2000;
    }

    .modal-backdrop.active { display: flex; }

    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 { font-size: 1.3rem; font-weight: 700; }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem; }
    .form-control {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: var(--primary-dark); }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- INTRO POPUP OVERLAY -->
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-content">
      <h1 class="intro-title">Campus <span>Pulse</span></h1>
      <p class="intro-tagline">Better Infrastructure. Cleaner Washrooms. Smarter Campus.</p>
      <div class="click-hint">Click anywhere to view all reported issues &rarr;</div>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="nav-brand">Campus <span>Pulse</span></div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="openModal('reviewModal')">Review Complaint</button>
      <button class="btn-nav btn-nav-primary" onclick="openModal('complaintModal')">+ File Complaint</button>
    </div>
  </header>

  <!-- MAIN FEED CONTAINER -->
  <main class="container" id="mainContainer">
    <div class="section-header">
      <h2>All Reported Issues</h2>
      <p>Browse campus infrastructure and washroom complaints. Upvote issues that affect you.</p>
    </div>

    <!-- SEARCH & FILTER TOOLBAR -->
    <div class="filter-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by issue or location..." oninput="filterIssues()" />
      </div>

      <select id="categoryFilter" class="filter-select" onchange="filterIssues()">
        <option value="All">Category ▼ (All)</option>
        <option value="Plumbing">Plumbing & Water</option>
        <option value="Washroom">Washroom Hygiene</option>
        <option value="Infrastructure">Infrastructure</option>
        <option value="Electrical">Electrical</option>
      </select>

      <select id="statusFilter" class="filter-select" onchange="filterIssues()">
        <option value="All">Status ▼ (All)</option>
        <option value="Waiting">Waiting</option>
        <option value="Under Process">Under Process</option>
        <option value="Issue Resolved">Issue Resolved</option>
      </select>
    </div>

    <!-- ISSUES LIST -->
    <div class="issues-feed" id="issuesFeed">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- MODAL: FILE NEW COMPLAINT -->
  <div class="modal-backdrop" id="complaintModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>File a New Complaint</h3>
        <button class="btn-close" onclick="closeModal('complaintModal')">&times;</button>
      </div>
      <form onsubmit="handleNewComplaint(event)">
        <div class="form-group">
          <label>Issue Title</label>
          <input type="text" id="newTitle" class="form-control" placeholder="e.g. Water Leakage" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="newCategory" class="form-control" required>
              <option value="Plumbing">Plumbing & Water</option>
              <option value="Washroom">Washroom Hygiene</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Electrical">Electrical</option>
            </select>
          </div>
          <div class="form-group">
            <label>Severity</label>
            <select id="newSeverity" class="form-control" required>
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Campus Location</label>
          <input type="text" id="newLocation" class="form-control" placeholder="e.g. Science Block B, 2nd Floor" required />
        </div>
        <button type="submit" class="btn-submit">Submit Report</button>
      </form>
    </div>
  </div>

  <!-- MODAL: REVIEW STATUS -->
  <div class="modal-backdrop" id="reviewModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Review Ticket Status</h3>
        <button class="btn-close" onclick="closeModal('reviewModal')">&times;</button>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <input type="text" id="ticketSearch" class="form-control" placeholder="Enter Ticket ID (e.g. CP-101)" />
        <button class="btn-nav btn-nav-primary" onclick="lookupTicket()">Track</button>
      </div>
      <div id="ticketResult"></div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initial Reported Issues Dataset
    let issuesData = [
      {
        id: "CP-101",
        icon: "🚰",
        title: "Water Leakage",
        category: "Plumbing",
        location: "Science Block B",
        severity: "High",
        status: "Under Process",
        affectedCount: 25,
        userAffected: false
      },
      {
        id: "CP-102",
        icon: "🚽",
        title: "Washroom Dirty",
        category: "Washroom",
        location: "Admin Block",
        severity: "Medium",
        status: "Waiting",
        affectedCount: 14,
        userAffected: false
      },
      {
        id: "CP-103",
        icon: "💡",
        title: "Flickering Tube Lights",
        category: "Electrical",
        location: "Central Library Hall 2",
        severity: "Low",
        status: "Issue Resolved",
        affectedCount: 6,
        userAffected: false
      }
    ];

    // Dismiss Blur Intro
    const introOverlay = document.getElementById('introOverlay');
    const mainContainer = document.getElementById('mainContainer');

    introOverlay.addEventListener('click', () => {
      introOverlay.classList.add('hidden');
      mainContainer.classList.add('visible');
    });

    // Modal Helpers
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-backdrop')) {
        e.target.classList.remove('active');
      }
    });

    // Render Cards
    function renderIssues(items) {
      const feed = document.getElementById('issuesFeed');
      if (items.length === 0) {
        feed.innerHTML = `
          <div class="empty-state">
            <p>No matching complaints found.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = items.map(issue => {
        // Badge color class mapping
        const sevClass = issue.severity === 'High' ? 'badge-sev-high' : (issue.severity === 'Medium' ? 'badge-sev-med' : 'badge-sev-low');
        const statusClass = issue.status === 'Waiting' ? 'badge-status-waiting' : (issue.status === 'Under Process' ? 'badge-status-process' : 'badge-status-resolved');

        return `
          <div class="issue-card">
            <div class="issue-top">
              <div class="issue-title">${issue.icon} ${issue.title}</div>
            </div>
            
            <div class="issue-location">📍 ${issue.location}</div>

            <div class="meta-badges">
              <span class="badge ${sevClass}">Severity : ${issue.severity}</span>
              <span class="badge ${statusClass}">Status : ${issue.status}</span>
            </div>

            <div class="issue-footer">
              <span class="affected-counter">${issue.affectedCount} Students affected</span>
              <button 
                class="btn-affected ${issue.userAffected ? 'active' : ''}" 
                onclick="toggleAffected('${issue.id}')"
              >
                ${issue.userAffected ? '✓ Affected' : "I'm affected too"}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Toggle "I'm affected too"
    function toggleAffected(id) {
      const issue = issuesData.find(item => item.id === id);
      if (issue) {
        if (!issue.userAffected) {
          issue.affectedCount += 1;
          issue.userAffected = true;
        } else {
          issue.affectedCount -= 1;
          issue.userAffected = false;
        }
        filterIssues();
      }
    }

    // Live Search and Filters
    function filterIssues() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const stat = document.getElementById('statusFilter').value;

      const filtered = issuesData.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(query) || item.location.toLowerCase().includes(query);
        const matchesCategory = (cat === 'All') || (item.category === cat);
        const matchesStatus = (stat === 'All') || (item.status === stat);
        return matchesSearch && matchesCategory && matchesStatus;
      });

      renderIssues(filtered);
    }

    // Handle New Complaint Submission
    function handleNewComplaint(e) {
      e.preventDefault();
      const title = document.getElementById('newTitle').value;
      const category = document.getElementById('newCategory').value;
      const severity = document.getElementById('newSeverity').value;
      const location = document.getElementById('newLocation').value;
      
      const iconMap = {
        Plumbing: '🚰',
        Washroom: '🚽',
        Infrastructure: '🚪',
        Electrical: '💡'
      };

      const newId = 'CP-' + Math.floor(100 + Math.random() * 900);
      const newIssue = {
        id: newId,
        icon: iconMap[category] || '⚠️',
        title: title,
        category: category,
        location: location,
        severity: severity,
        status: 'Waiting',
        affectedCount: 1,
        userAffected: true
      };

      issuesData.unshift(newIssue);
      filterIssues();
      closeModal('complaintModal');
      e.target.reset();
      alert(`Issue logged! Tracking ID: ${newId}`);
    }

    // Lookup Ticket in Review Modal
    function lookupTicket() {
      const id = document.getElementById('ticketSearch').value.trim().toUpperCase();
      const result = document.getElementById('ticketResult');
      const found = issuesData.find(i => i.id === id);

      if (found) {
        result.innerHTML = `
          <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 1rem;">
            <strong>Ticket #${found.id}</strong> — <span>${found.title}</span>
            <div style="margin-top: 0.5rem; font-size: 0.9rem;"><strong>Status:</strong> ${found.status}</div>
            <div style="font-size: 0.9rem;"><strong>Location:</strong> ${found.location}</div>
          </div>
        `;
      } else {
        result.innerHTML = `<p style="color: #dc2626; margin-top: 1rem; font-size: 0.9rem;">Ticket ID not found.</p>`;
      }
    }

    // Initial Render
    renderIssues(issuesData);
  </script>
</body>
</html>
